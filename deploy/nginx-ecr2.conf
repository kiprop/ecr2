# Paste INSIDE the existing `server { listen 443 ssl http2; ... }` block for dhda.pedaids.org,
# next to the /compliance/, /te/ and /skills/ blocks. The app keeps the /ecr2 prefix (BASE_PATH=/ecr2),
# so proxy_pass has NO trailing path.
    location = /ecr2 { return 301 /ecr2/; }
    location /ecr2/ {
        proxy_pass http://127.0.0.1:8304;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;
        proxy_read_timeout 120s;
        client_max_body_size 30m;
    }
